name: Ingest — MSSS Urgences (hourly)

# Writes to Supabase only — nothing is committed to the repository.
#
# Once pg_cron + the ingest-urgences Edge Function are live (migration 003),
# set the repository variable INGEST_VIA_PG_CRON=true: scheduled runs are then
# skipped so data isn't ingested twice. Manual runs (workflow_dispatch) always
# execute, as a backup if pg_cron is down.

on:
  schedule:
    # Every hour at :05 (gives MSSS time to publish)
    - cron: "5 * * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

# Drifting schedules can overlap; never run two ingests at once.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch & Upsert
    if: github.event_name == 'workflow_dispatch' || vars.INGEST_VIA_PG_CRON != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ingest script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm ingest
